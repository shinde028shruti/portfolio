<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12100e"/>
      <stop offset="50%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcf82"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad)"/>

  <!-- Decorative rings & grid -->
  <circle cx="400" cy="225" r="180" fill="none" stroke="rgba(255, 207, 130, 0.12)" stroke-width="2"/>
  <circle cx="400" cy="225" r="120" fill="none" stroke="rgba(255, 207, 130, 0.2)" stroke-dasharray="8 6"/>

  <!-- Hero Crest Graphic -->
  <g transform="translate(400, 160)" text-anchor="middle">
    <circle cx="0" cy="0" r="48" fill="rgba(255, 207, 130, 0.15)" stroke="url(#gold-grad)" stroke-width="2"/>
    <path d="M-18 -12 L0 -28 L18 -12 L12 18 L-12 18 Z" fill="none" stroke="url(#gold-grad)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="6" fill="#ffcf82"/>
  </g>

  <!-- Typography -->
  <text x="400" y="260" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" fill="url(#gold-grad)" text-anchor="middle" letter-spacing="2">ITALIANO</text>
  <text x="400" y="295" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="500" fill="#a8a29e" text-anchor="middle" letter-spacing="4">GOURMET RESTAURANT &amp; E-COMMERCE</text>

  <!-- Interactive badges -->
  <g transform="translate(400, 350)" text-anchor="middle">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="rgba(255, 207, 130, 0.1)" stroke="url(#gold-grad)" stroke-width="1.5"/>
    <text x="0" y="6" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffcf82">✦ WEBFLOW CMS &amp; CART ENGINE ✦</text>
  </g>
</svg>
