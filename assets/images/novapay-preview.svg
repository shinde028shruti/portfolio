<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="fintech-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091b1a"/>
      <stop offset="50%" stop-color="#0c2d27"/>
      <stop offset="100%" stop-color="#041210"/>
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#fintech-bg)"/>

  <!-- Simulated Credit/Payment Card 3D -->
  <g transform="translate(400, 200) rotate(-4)">
    <rect x="-190" y="-110" width="380" height="220" rx="20" fill="linear-gradient(135deg, #10b981 0%, #047857 100%)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.6))"/>
    <circle cx="-130" cy="-60" r="18" fill="rgba(255,255,255,0.2)"/>
    <rect x="-130" y="20" width="180" height="12" rx="6" fill="rgba(255,255,255,0.7)"/>
    <rect x="-130" y="45" width="100" height="10" rx="5" fill="rgba(255,255,255,0.4)"/>
    <circle cx="120" cy="50" r="16" fill="#fbbf24" opacity="0.9"/>
    <circle cx="140" cy="50" r="16" fill="#ef4444" opacity="0.9"/>
  </g>

  <text x="400" y="380" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">NOVAPAY GLOBAL CHECKOUT</text>
  <text x="400" y="410" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#34d399" text-anchor="middle">MULTI-CURRENCY API &amp; INSTANT SETTLEMENTS</text>
</svg>
